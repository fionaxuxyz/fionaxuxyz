668C">Python · FastAPI · Tool Calling · RAG · Memory</text></g><g transform="translate(22 320)"><rect width="566" height="275" rx="18" fill="white" stroke="#B995C8" stroke-width="2.4" stroke-dasharray="9 8"/><circle cx="39" cy="42" r="20" fill="#F3E8F7"/><text x="39" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#745783">03</text><text x="70" y="48" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#574562">全栈开发与系统工程 / Full-Stack &amp; Systems</text><text x="27" y="115" font-family="Arial,sans-serif" font-size="19" fill="#56525C">I connect interfaces, services and databases end to end.</text><text x="27" y="150" font-family="Arial,sans-serif" font-size="19" fill="#56525C">Experienced in business APIs, messaging and infrastructure.</text><path d="M27 205 H535" stroke="#E7D7EB"/><text x="27" y="245" font-family="Arial,sans-serif" font-size="17" fill="#80668C">Spring Boot · PostgreSQL · Redis · Docker · RabbitMQ</text></g><g transform="translate(612 320)"><rect width="566" height="275" rx="18" fill="white" stroke="#B995C8" stroke-width="2.4" stroke-dasharray="9 8"/><circle cx="39" cy="42" r="20" fill="#F3E8F7"/><text x="39" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#745783">04</text><text x="70" y="48" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#574562">3D Web 与 Blender 建模 / 3D Web &amp; Blender</text><text x="27" y="115" font-family="Arial,sans-serif" font-size="19" fill="#56525C">I bring spatial ideas to life through interactive 3D.</text><text x="27" y="150" font-family="Arial,sans-serif" font-size="19" fill="#56525C">From parametric geometry to digital scenes and experiences.</text><path d="M27 205 H535" stroke="#E7D7EB"/><text x="27" y="245" font-family="Arial,sans-serif" font-size="17" fill="#80668C">Three.js · React Three Fiber · Blender · WebGL</text></g></svg>